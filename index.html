<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <!-- <base href="/"> -->

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="The joy of learning.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="edu_scale_admin">

  <!-- App Icons -->
  <link rel="apple-touch-icon" href="icons/logo.png">
  <link rel="icon" type="image/png" href="icons/logo.png" />

  <title>EduScale Admin</title>

  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    #loading {
      position: fixed;
      inset: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      transition: opacity .35s ease;
    }


    .spinner {
      margin-top: 28px;
      width: 42px;
      height: 42px;
      border: 4px solid #E3E3E3;
      border-top: 4px solid #1565C0;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .loading-text {
      margin-top: 18px;
      color: #666666;
      font-size: 16px;
      letter-spacing: .5px;
      user-select: none;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.9;
      }

      50% {
        transform: scale(1.08);
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <!-- Loading Screen -->
  <div id="loading">
    <!-- <img src="icons/logo.png" class="logo" alt="EduScale Logo"> -->

    <div class="spinner"></div>

    <div class="loading-text">Loading...</div>
  </div>

  <!-- Flutter -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    function hideLoader() {
      const loader = document.getElementById("loading");

      if (!loader) return;

      loader.style.opacity = "0";

      setTimeout(() => {
        loader.remove();
      }, 350);
    }

    // Flutter emits this event when the first frame is rendered.
    window.addEventListener("flutter-first-frame", hideLoader);

    // Fallback in case the event isn't fired for some reason.
    window.addEventListener("load", () => {
      setTimeout(() => {
        if (document.getElementById("loading")) {
          hideLoader();
        }
      }, 10000);
    });
  </script>

</body>

</html>
